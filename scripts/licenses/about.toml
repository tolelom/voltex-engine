# cargo-about license policy for Voltex.
#
# Voltex itself is dual MIT OR Apache-2.0. This file declares which
# transitive-dependency licenses are acceptable. The Rust ecosystem is
# dominated by permissive licenses (MIT, Apache-2.0, BSD-*), so this list
# stays small. Any new transitive license outside this list makes
# `scripts/gen_third_party_licenses.sh` fail, forcing a conscious decision.
#
# License IDs are SPDX identifiers.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    # Bundled C source code with custom permissive notices that don't
    # have an SPDX identifier (typically wgpu/winit transitive deps).
    "OFL-1.1",
]

# Every OS `voltex build` supports, so one file covers platform-only
# dependencies (windows-sys, objc2, wayland, ...) whichever host runs it.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# Only what ships inside a built game: skip build scripts' and tests'
# dependencies, and the workspace's own crates (all `publish = false`).
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }

# No per-crate overrides today. If a future transitive comes in with an
# unrecognized notice format, add a section like:
#   [crates.somecrate]
#   accepted = [...]
# or
#   [crates.somecrate.clarifications]
#   files = [ ... ]
