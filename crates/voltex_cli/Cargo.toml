[package]
name = "voltex_cli"
version.workspace = true
edition = "2021"
license.workspace = true
publish.workspace = true

[[bin]]
name = "voltex"
path = "src/main.rs"
# Suppress rustdoc for the CLI bin — the same crate name `voltex` is already
# used by the facade lib crate, and cargo issue #6313 emits a known
# filename-collision warning otherwise. The bin still builds normally.
doc = false

[dependencies]
voltex_asset = { path = "../voltex_asset" }
# Scene parsing for build-time asset-reference scanning (workspace crate —
# the external-deps-zero policy holds; pulls only math/asset, no GPU).
voltex_ecs = { path = "../voltex_ecs" }

[dev-dependencies]
# E2E bundle test encodes a real PNG / WAV the engine's own decoders read
# (workspace crates — external-deps-zero policy holds for dev deps too).
voltex_image = { path = "../voltex_image" }
voltex_audio = { path = "../voltex_audio" }
