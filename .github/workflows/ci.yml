name: ci

# Blocking: build + clippy (-D warnings) + tests on Linux and Windows.
# Advisory: macOS, coverage (measured, no threshold), cargo-deny.
# Manual: e2e `voltex new` + `voltex build` smoke test.
#
# Linux needs libasound2-dev for voltex_audio's ALSA backend.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    name: build + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install ALSA headers
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: cargo build --workspace
        run: cargo build --workspace
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace --lib
        run: cargo test --workspace --lib
      - name: cargo test -p voltex_cli
        run: cargo test -p voltex_cli

  macos:
    name: build + test (macos-latest, advisory)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo build --workspace
        run: cargo build --workspace
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace --lib
        run: cargo test --workspace --lib

  # GPU tests run on lavapipe (software Vulkan); they skip when no adapter
  # is found, so the number depends on the runner. Reported, not gated.
  coverage:
    name: coverage (ubuntu-latest, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install ALSA headers + lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev mesa-vulkan-drivers libvulkan1
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: cargo llvm-cov --workspace --lib
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          WGPU_ADAPTER_NAME: llvmpipe
        run: cargo llvm-cov --workspace --lib --summary-only -- --include-ignored

  deny:
    name: cargo-deny (ubuntu-latest, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  e2e-quickstart:
    name: e2e new + build (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: cargo test -p voltex_cli --test e2e_new_build
        run: cargo test -p voltex_cli --test e2e_new_build -- --ignored --nocapture
