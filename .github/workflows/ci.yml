name: ci

# Blocking: build + clippy (-D warnings) + tests on Linux, Windows and macOS;
#           cargo-deny bans, licenses and sources.
# Advisory: cargo-deny advisories (a new RUSTSEC entry should not block
#           unrelated PRs).
# Manual:   coverage, e2e `voltex new` + `voltex build` smoke test.
#
# Linux needs libasound2-dev for voltex_audio's ALSA backend.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build-and-test:
    name: build + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: cargo build --workspace
        run: cargo build --workspace
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace --lib
        run: cargo test --workspace --lib
      - name: cargo test -p voltex_cli
        run: cargo test -p voltex_cli

  deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [bans licenses sources, advisories]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  # GPU tests run on lavapipe (software Vulkan); they skip when no adapter
  # is found, so the number depends on the runner.
  coverage:
    name: coverage (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install ALSA headers + lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev mesa-vulkan-drivers libvulkan1
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: cargo llvm-cov --workspace --lib
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          WGPU_ADAPTER_NAME: llvmpipe
        run: cargo llvm-cov --workspace --lib --summary-only -- --include-ignored

  e2e-quickstart:
    name: e2e new + build (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: cargo test -p voltex_cli --test e2e_new_build
        run: cargo test -p voltex_cli --test e2e_new_build -- --ignored --nocapture
