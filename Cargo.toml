[workspace]
resolver = "2"
members = [
    # 엔진
    "engine/voltex",
    "engine/voltex_ai",
    "engine/voltex_asset",
    "engine/voltex_audio",
    "engine/voltex_ecs",
    "engine/voltex_editor",
    "engine/voltex_image",
    "engine/voltex_math",
    "engine/voltex_net",
    "engine/voltex_physics",
    "engine/voltex_platform",
    "engine/voltex_renderer",
    "engine/voltex_renderer_ecs",
    "engine/voltex_runtime",
    "engine/voltex_script",
    # 엔진을 쓰는 도구
    "tools/voltex_capture",
    "tools/voltex_cli",
    # 엔진으로 만든 게임
    "games/voltex_depths",
    "games/voltex_leap",
    "games/voltex_survivor",
    # 기능별 예제
    "examples/asset_demo",
    "examples/audio_demo",
    "examples/boids_demo",
    "examples/deferred_demo",
    "examples/editor_demo",
    "examples/game_ready_demo",
    "examples/hierarchy_demo",
    "examples/ibl_demo",
    "examples/many_cubes",
    "examples/model_viewer",
    "examples/multi_light_demo",
    "examples/pbr_demo",
    "examples/runtime_demo",
    "examples/shadow_demo",
    "examples/survivor_game",
    "examples/triangle",
    "examples/tutorial_minigame",
]

[workspace.package]
# Shared metadata for every workspace crate. Each crate's Cargo.toml
# opts in with `license.workspace = true` / `version.workspace = true`.
# The dual licensing matches the LICENSE-MIT and LICENSE-APACHE files
# at the repo root. `version` tracks the engine release line so that
# `voltex --version` (CARGO_PKG_VERSION of voltex_cli) reports the real
# version instead of the old per-crate 0.1.0 placeholder.
version = "1.0.173"
license = "MIT OR Apache-2.0"
# Not published to crates.io; members opt in with `publish.workspace = true`.
# cargo-deny's `allow-wildcard-paths` relies on it for path dependencies.
publish = false

[workspace.dependencies]
voltex = { path = "engine/voltex" }
voltex_math = { path = "engine/voltex_math" }
voltex_platform = { path = "engine/voltex_platform" }
voltex_renderer = { path = "engine/voltex_renderer" }
voltex_renderer_ecs = { path = "engine/voltex_renderer_ecs" }
voltex_image = { path = "engine/voltex_image" }
voltex_ecs = { path = "engine/voltex_ecs" }
voltex_asset = { path = "engine/voltex_asset" }
voltex_physics = { path = "engine/voltex_physics" }
voltex_audio = { path = "engine/voltex_audio" }
voltex_ai = { path = "engine/voltex_ai" }
voltex_net = { path = "engine/voltex_net" }
voltex_script = { path = "engine/voltex_script" }
voltex_editor = { path = "engine/voltex_editor" }
voltex_runtime = { path = "engine/voltex_runtime" }
voltex_cli = { path = "tools/voltex_cli" }
voltex_capture = { path = "tools/voltex_capture" }
wgpu = "28.0"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
env_logger = "0.11"
log = "0.4"
thiserror = "2.0"
