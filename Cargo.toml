[workspace]
resolver = "2"
members = [
    "crates/voltex",
    "crates/voltex_math",
    "crates/voltex_platform",
    "crates/voltex_renderer",
    "crates/voltex_renderer_ecs",
    "crates/voltex_image",
    "crates/voltex_ecs",
    "crates/voltex_asset",
    "examples/triangle",
    "examples/model_viewer",
    "examples/many_cubes",
    "examples/hierarchy_demo",
    "examples/asset_demo",
    "examples/pbr_demo",
    "examples/multi_light_demo",
    "examples/shadow_demo",
    "examples/ibl_demo",
    "examples/deferred_demo",
    "crates/voltex_physics",
    "crates/voltex_audio",
    "examples/audio_demo",
    "crates/voltex_ai",
    "crates/voltex_net",
    "crates/voltex_script",
    "crates/voltex_editor",
    "crates/voltex_runtime",
    "crates/voltex_cli",
    "crates/voltex_capture",
    "examples/editor_demo",
    "examples/survivor_game",
    "examples/runtime_demo",
    "examples/tutorial_minigame",
    "examples/game_ready_demo",
    "examples/boids_demo",
    "games/voltex_survivor",
    "games/voltex_depths",
    "games/voltex_leap",
]

[workspace.package]
# Shared metadata for every workspace crate. Each crate's Cargo.toml
# opts in with `license.workspace = true` / `version.workspace = true`.
# The dual licensing matches the LICENSE-MIT and LICENSE-APACHE files
# at the repo root. `version` tracks the engine release line so that
# `voltex --version` (CARGO_PKG_VERSION of voltex_cli) reports the real
# version instead of the old per-crate 0.1.0 placeholder.
version = "1.0.111"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
voltex = { path = "crates/voltex" }
voltex_math = { path = "crates/voltex_math" }
voltex_platform = { path = "crates/voltex_platform" }
voltex_renderer = { path = "crates/voltex_renderer" }
voltex_renderer_ecs = { path = "crates/voltex_renderer_ecs" }
voltex_image = { path = "crates/voltex_image" }
voltex_ecs = { path = "crates/voltex_ecs" }
voltex_asset = { path = "crates/voltex_asset" }
voltex_physics = { path = "crates/voltex_physics" }
voltex_audio = { path = "crates/voltex_audio" }
voltex_ai = { path = "crates/voltex_ai" }
voltex_net = { path = "crates/voltex_net" }
voltex_script = { path = "crates/voltex_script" }
voltex_editor = { path = "crates/voltex_editor" }
voltex_runtime = { path = "crates/voltex_runtime" }
voltex_cli = { path = "crates/voltex_cli" }
voltex_capture = { path = "crates/voltex_capture" }
wgpu = "28.0"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
env_logger = "0.11"
log = "0.4"
thiserror = "2.0"
